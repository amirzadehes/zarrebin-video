name: Find similar library images
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: find-similar
  cancel-in-progress: false
jobs:
  similar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Match needs to library
        env: { GROQ_API_KEY: "${{ secrets.GROQ_API_KEY }}" }
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for round in 1 2 3 4 5 6; do
            git fetch -q origin main && git reset -q --hard origin/main
            python tools/find_similar.py
            git add -A
            if git diff --cached --quiet; then echo "no change"; exit 0; fi
            git commit -qm "similar library images"
            if git push -q origin main; then echo pushed; exit 0; fi; sleep 4
          done; exit 1
