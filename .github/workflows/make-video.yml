name: Make video
on:
  push:
    branches: [main]
    paths: ['episodes/*/request.json']
  workflow_dispatch:
    inputs:
      episode:
        description: episode folder name
        required: true
permissions:
  contents: write
concurrency:
  group: make-video
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      ep: ${{ steps.ep.outputs.ep }}
      matrix: ${{ steps.dir.outputs.matrix }}
      total: ${{ steps.dir.outputs.total }}
      review: ${{ steps.mode.outputs.review }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - id: ep
        env: { EP_INPUT: "${{ github.event.inputs.episode }}" }
        run: |
          if [ -n "$EP_INPUT" ]; then ep="$EP_INPUT"; else ep=$(git diff --name-only HEAD~1 HEAD -- 'episodes/*/request.json' | head -1 | cut -d/ -f2); fi
          echo "ep=$ep" >> "$GITHUB_OUTPUT"
      - id: mode
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json
          q = json.load(open('episodes/${{ steps.ep.outputs.ep }}/request.json'))
          print('review=' + str(bool(q.get('review'))).lower()); print('use_plan=' + str(bool(q.get('use_plan'))).lower()); print('poster=' + str(q.get('mode') == 'poster').lower())
          PY
      - run: pip install edge-tts numpy scipy
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1
      - name: Narration, voice, timing
        if: steps.mode.outputs.use_plan != 'true'
        env: { GROQ_API_KEY: "${{ secrets.GROQ_API_KEY }}", GEMINI_API_KEY: "${{ secrets.GEMINI_API_KEY }}" }
        run: |
          set -o pipefail
          rm -f build.log
          python tools/narrate_tts.py "${{ steps.ep.outputs.ep }}" 2>&1 | tee -a build.log
      - name: Refresh the needed-images list for the current text
        if: steps.mode.outputs.poster != 'true'
        continue-on-error: true
        env: { GROQ_API_KEY: "${{ secrets.GROQ_API_KEY }}" }
        run: |
          set -o pipefail
          python tools/refresh_needs.py "${{ steps.ep.outputs.ep }}" 2>&1 | tee -a build.log
      - id: dir
        name: Scene director
        env: { GROQ_API_KEY: "${{ secrets.GROQ_API_KEY }}" }
        run: |
          set -o pipefail
          if [ "${{ steps.mode.outputs.poster }}" = "true" ]; then python tools/direct_poster.py "${{ steps.ep.outputs.ep }}" 2>&1 | tee -a build.log; else python tools/direct_scenes.py "${{ steps.ep.outputs.ep }}" 2>&1 | tee -a build.log; fi
      - name: Check the voice matches the subtitles
        run: |
          set -o pipefail
          python tools/check_voice.py "${{ steps.ep.outputs.ep }}" 2>&1 | tee -a build.log
      - name: Quality check (retention rules, report only)
        continue-on-error: true
        run: python tools/qa_scenes.py "${{ steps.ep.outputs.ep }}" 2>&1 | tee -a build.log
      - name: Ambience beds (choose one per scene, only where none is chosen yet)
        continue-on-error: true
        env: { GROQ_API_KEY: "${{ secrets.GROQ_API_KEY }}" }
        run: python tools/make_ambience.py assign "${{ steps.ep.outputs.ep }}" 2>&1 | tee -a build.log
      - name: Sound effects
        if: steps.mode.outputs.review != 'true'
        env: { GROQ_API_KEY: "${{ secrets.GROQ_API_KEY }}" }
        run: python tools/make_sfx.py "${{ steps.ep.outputs.ep }}" 2>&1 | tee -a build.log
      - name: Background-layer and image-effect sounds
        if: steps.mode.outputs.review != 'true'
        continue-on-error: true
        run: python tools/make_bgfx.py "${{ steps.ep.outputs.ep }}" 2>&1 | tee -a build.log
      - name: Background music
        if: steps.mode.outputs.review != 'true'
        env: { GROQ_API_KEY: "${{ secrets.GROQ_API_KEY }}" }
        run: |
          set -o pipefail
          python tools/make_music.py "${{ steps.ep.outputs.ep }}" 2>&1 | tee -a build.log
          ls -la episodes/${{ steps.ep.outputs.ep }}/music.wav 2>/dev/null | tee -a build.log || true
      - name: Ambience beds (mix)
        if: steps.mode.outputs.review != 'true'
        continue-on-error: true
        run: python tools/make_ambience.py build "${{ steps.ep.outputs.ep }}" 2>&1 | tee -a build.log
      - name: Save narration, scenes and log in the repo
        if: always()
        run: |
          ep="${{ steps.ep.outputs.ep }}"
          [ -f build.log ] && tail -c 6000 build.log > episodes/$ep/build.log
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in narration.txt narration.meta voice.mp3 timing.json scenes.json director.json qa.json build.log; do [ -f episodes/$ep/$f ] && git add episodes/$ep/$f; done
          for f in needs.json similar.json picks.json; do git add -A -- episodes/$ep/$f 2>/dev/null || true; done
          git diff --cached --quiet || { git commit -qm "episode $ep: narration, scenes, log"; for i in 1 2 3 4 5 6; do git pull -q --rebase --autostash origin main && git push -q origin main && break; sleep 5; done; }
      - name: Notify (review ready)
        if: success() && steps.mode.outputs.review == 'true'
        run: 'python tools/notify.py "بازبینی آماده است" "صحنه‌های ${{ steps.ep.outputs.ep }} آماده‌ی بازبینی‌اند."'
      - name: Notify (failed)
        if: failure()
        run: 'python tools/notify.py "ساخت ناموفق بود" "${{ steps.ep.outputs.ep }}: در build.log دلیلش هست."'
      - uses: actions/upload-artifact@v4
        with:
          name: episode-data
          path: |
            episodes/${{ steps.ep.outputs.ep }}/voice.mp3
            episodes/${{ steps.ep.outputs.ep }}/scenes.json
            episodes/${{ steps.ep.outputs.ep }}/sfx.wav
            episodes/${{ steps.ep.outputs.ep }}/bgfx.wav
            episodes/${{ steps.ep.outputs.ep }}/music.wav
            episodes/${{ steps.ep.outputs.ep }}/ambience.wav
          retention-days: 2
  check3d:
    # Is the 3D (depth) effect really visible in every scene that should have it? Waits a few minutes for depth maps that are still being made (workflow "Depth maps"), then warns on the phone. Never fails the build.
    needs: prepare
    if: needs.prepare.outputs.review != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: npm install --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with: { name: episode-data, path: episode-data }
      - name: 3D check
        env: { CHROME_PATH: /usr/bin/google-chrome }
        run: |
          ep="${{ needs.prepare.outputs.ep }}"
          cp episode-data/scenes.json episodes/$ep/scenes.json 2>/dev/null || cp episode-data/*/scenes.json episodes/$ep/scenes.json 2>/dev/null || true
          fm=$(python3 -c "import json;print(' '.join(json.load(open('episodes/$ep/request.json')).get('formats') or ['v']))")
          msg=""
          for f in $fm; do
            for round in 1 2 3 4 5 6; do
              node engine/probe3d.js "$ep" "$f" probe_$f.json && break
              # only missing depth maps: the "Depth maps" workflow may still be running, so fetch the newest maps and look again
              python3 -c "import json,sys;r=json.load(open('probe_$f.json'));sys.exit(0 if r['bad'] and all(s['verdict']=='NO-DEPTH-MAP' for s in r['scenes'] if s['n'] in r['bad']) else 1)" || break
              [ "$round" = 6 ] && break
              git fetch -q --depth=1 origin main && git checkout -q origin/main -- episodes/$ep/depth episodes/$ep/bg episodes/$ep/cards 2>/dev/null || true
              sleep 40
            done
            b=$(python3 -c "import json;r=json.load(open('probe_$f.json'));print('، '.join(str(n) for n in r['bad']))" 2>/dev/null || true)
            [ -n "$b" ] && msg="$msg [$f] $b"
          done
          if [ -n "$msg" ]; then echo "::warning::3D missing in scenes:$msg"; python3 tools/notify.py "⚠️ سه‌بعدی بعضی صحنه‌ها کار نمی‌کند" "$ep: صحنه‌ی$msg (نقشه‌ی عمق ساخته نشده یا افکت دیده نمی‌شود)"; else echo "3D OK"; fi
          exit 0
  render:
    needs: [prepare, check3d]
    if: needs.prepare.outputs.review != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        c: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1
      - uses: actions/download-artifact@v4
        with: { name: episode-data, path: episode-data }
      - name: Render chunk
        env: { CHROME_PATH: /usr/bin/google-chrome }
        run: |
          ep="${{ needs.prepare.outputs.ep }}"
          cp episode-data/scenes.json episodes/$ep/scenes.json 2>/dev/null || cp episode-data/*/scenes.json episodes/$ep/scenes.json
          git fetch -q --depth=1 origin main && git checkout -q origin/main -- episodes/$ep/depth episodes/$ep/bg episodes/$ep/cards 2>/dev/null || true   # depth maps / pictures that arrived after this build started
          mkdir -p out
          # engine/render-v2.js stops with an error when a picture of the repo did not load (exit 3) or the chunk has the wrong number of frames (exit 4): such a chunk is rendered again, never published
          ok=0; for attempt in 1 2 3; do
            if node engine/render-v2.js "$ep" ${{ matrix.c.f }} ${{ matrix.c.a }} ${{ matrix.c.b }} out/${{ matrix.c.f }}_${{ matrix.c.i }}.mp4 ${{ matrix.c.s || 1 }}; then ok=1; break; fi
            echo "render attempt $attempt failed, trying again"; sleep 10
          done
          [ "$ok" = 1 ] || exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.c.f }}-${{ matrix.c.i }}
          path: out/${{ matrix.c.f }}_${{ matrix.c.i }}.mp4
          retention-days: 1
  merge:
    needs: [prepare, render]
    if: needs.prepare.outputs.review != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1
      - uses: actions/download-artifact@v4
        with: { name: episode-data, path: episode-data }
      - uses: actions/download-artifact@v4
        with: { pattern: part-*, merge-multiple: true, path: parts }
      - name: Join, add voice, master loudness
        run: |
          total="${{ needs.prepare.outputs.total }}"; v=$(find episode-data -name voice.mp3 | head -1); sfx=$(find episode-data -name sfx.wav | head -1)
          fade="afade=t=out:st=$(python3 -c "print(max(0,$total-0.6))"):d=0.6,apad,loudnorm=I=-14:TP=-2.2:LRA=11"
          mus=$(find episode-data -name music.wav | head -1)
          inputs="-i $v"; n=1; mix="[vo]"; w="1"
          [ -n "$sfx" ] && { inputs="$inputs -i $sfx"; n=$((n+1)); mix="$mix[$n:a]"; w="$w 0.4"; }
          bgfx=$(find episode-data -name bgfx.wav | head -1)   # background-layer / image-effect sounds (volume is set per event in scenes.json)
          [ -n "$bgfx" ] && { inputs="$inputs -i $bgfx"; n=$((n+1)); mix="$mix[$n:a]"; w="$w 0.8"; }
          amb=$(find episode-data -name ambience.wav | head -1)   # ambience beds (already normalised quiet; level per scene / episode is set in scenes.json)
          [ -n "$amb" ] && { inputs="$inputs -i $amb"; n=$((n+1)); mix="$mix[$n:a]"; w="$w 1.0"; }
          mv=$(python3 -c "import json,sys,glob; f=glob.glob('episode-data/**/scenes.json',recursive=True); print(float(json.load(open(f[0]))['meta'].get('musicVol',100))/100 if f else 1)" 2>/dev/null || echo 1)   # music level set in the app (percent, default 100)
          if [ -n "$mus" ]; then inputs="$inputs -i $mus"; mi=$((n+1)); n=$((n+1)); mix="$mix[mduck]"; w="$w $mv"
            fc="[1:a]asplit=2[vo][key];[$mi:a][key]sidechaincompress=threshold=0.04:ratio=3:attack=30:release=600:makeup=1[mduck];"
          else fc="[1:a]anull[vo];"; fi
          fc="$fc${mix}amix=inputs=$(echo $w | wc -w):duration=first:weights=$w:normalize=0,$fade[a]"
          for f in v h; do
            ls parts | grep "^${f}_" | sort -V | sed "s|^|file parts/|" > list_$f.txt
            [ -s list_$f.txt ] || continue
            # the chunks are near-lossless; this is the one real encode. Horizontal (2560x1440) gets a higher ceiling than vertical (1080x1920)
            if [ "$f" = h ]; then venc="-preset medium -crf 18 -maxrate 14M -bufsize 28M"; else venc="-preset slow -crf 20 -maxrate 8M -bufsize 16M"; fi
            ffmpeg -loglevel error -y -f concat -safe 0 -i list_$f.txt $inputs -filter_complex "$fc" -map 0:v -map "[a]" -t $total \
              -c:v libx264 $venc -tune animation -pix_fmt yuv420p -c:a aac -b:a 160k -ar 44100 -ac 2 -movflags +faststart final_$f.mp4
            d=$(ffprobe -v error -show_entries format=duration -of csv=p=0 final_$f.mp4)
            python3 -c "import sys; sys.exit(0 if float('$d')>=float('$total')-0.6 else 1)" || { echo "final_$f.mp4 is too short: $d s, expected $total s"; exit 1; }
          done
          ls -la final_*.mp4
      - name: Publish release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          ep="${{ needs.prepare.outputs.ep }}"; tag="$ep-$(date +%Y%m%d-%H%M%S)"; files=""
          [ -f final_v.mp4 ] && cp final_v.mp4 "${ep}_vertical.mp4" && files="$files ${ep}_vertical.mp4"
          [ -f final_h.mp4 ] && cp final_h.mp4 "${ep}_horizontal.mp4" && files="$files ${ep}_horizontal.mp4"
          gh release create "$tag" $files --title "$ep" --notes "Rendered automatically" -R "${{ github.repository }}"
      - name: Notify (video ready)
        run: 'python tools/notify.py "ویدیو آماده شد 🎬" "${{ needs.prepare.outputs.ep }} در لیست ویدیوهای اپ است."'
  notify_fail:
    needs: [prepare, render, merge]
    if: always() && (needs.render.result == 'failure' || needs.merge.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: 'python tools/notify.py "ساخت ویدیو ناموفق بود" "${{ needs.prepare.outputs.ep }}: رندر یا ترکیب خطا داد."'
