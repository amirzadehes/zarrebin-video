name: Persian tags for library images
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/make_fa_tags.py']
permissions:
  contents: write
concurrency:
  group: fa-tags
  cancel-in-progress: false
jobs:
  tags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Add Persian names and tags
        env: { GROQ_API_KEY: "${{ secrets.GROQ_API_KEY }}" }
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for round in 1 2 3 4 5 6; do
            git fetch -q origin main && git reset -q --hard origin/main
            python tools/make_fa_tags.py
            git add -A
            if git diff --cached --quiet; then echo "no change"; exit 0; fi
            git commit -qm "library: Persian names and search tags"
            if git push -q origin main; then echo pushed; exit 0; fi; sleep 4
          done; exit 1
