name: Transcribe voice
on:
  push:
    branches: [main]
    paths: ['episodes/*/transcribe.json']
  workflow_dispatch:
    inputs:
      episode:
        description: episode folder name
        required: true
permissions:
  contents: write
concurrency:
  group: transcribe-episode
  cancel-in-progress: false
jobs:
  transcribe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Whisper transcript with word times
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          EP_INPUT: ${{ github.event.inputs.episode }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$EP_INPUT" ]; then eps="$EP_INPUT"; else eps=$(git diff --name-only HEAD~1 HEAD -- 'episodes/*/transcribe.json' | cut -d/ -f2 | sort -u); fi
          set -o pipefail
          for ep in $eps; do
            python tools/transcribe_voice.py "$ep" 2>&1 | tee err.txt || echo "FAILED" >> err.txt
            { tail -c 800 err.txt; echo; echo "ts=$(date +%s)"; } > episodes/$ep/transcribe.log   # the app reads this (changes on every run) to tell the owner what happened
            for f in voice.mp3 timing.json narration.txt transcribe.log; do [ -f episodes/$ep/$f ] && git add episodes/$ep/$f; done
            git add -A -- episodes/$ep/cuts.json 2>/dev/null || true
          done
          rm -f err.txt
          git diff --cached --quiet && exit 0
          git commit -qm "episode transcript: $eps"
          for i in 1 2 3 4 5 6; do git pull -q --rebase --autostash origin main && git push -q origin main && exit 0; sleep 5; done; exit 1
