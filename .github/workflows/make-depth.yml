name: Depth maps for scene photos
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['episodes/*/bg/**', 'tools/make_depth.py']
permissions:
  contents: write
concurrency:
  group: make-depth
  cancel-in-progress: false
jobs:
  depth:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install (CPU torch + transformers)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers pillow numpy scipy scikit-image
      - name: Make depth maps
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for round in 1 2 3 4 5 6; do
            git fetch -q origin main && git reset -q --hard origin/main
            python tools/make_depth.py
            git add -A
            if git diff --cached --quiet; then echo "no change"; exit 0; fi
            git commit -qm "depth maps for scene photos"
            if git push -q origin main; then echo pushed; exit 0; fi; sleep 4
          done; exit 1
