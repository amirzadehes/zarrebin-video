name: Process inbox
on:
  push:
    branches: [main]
    paths: ['inbox/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: process-inbox
  cancel-in-progress: false
jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - run: pip install -r tools/requirements.txt
      - name: Process and commit (repeat until inbox is empty)
        env: { GROQ_API_KEY: "${{ secrets.GROQ_API_KEY }}" }
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for round in 1 2 3 4 5 6 7 8; do
            git fetch -q origin main && git reset -q --hard origin/main
            python tools/process_inbox.py
            git diff --quiet library/catalog.json || { python tools/make_fa_tags.py || true; python tools/find_similar.py || true; }
            git add -A
            if git diff --cached --quiet; then echo "nothing left to do"; exit 0; fi
            git commit -qm "library: process inbox"
            if git push -q origin main; then echo "round $round pushed"; else echo "push conflict, redo round"; sleep 4; fi
          done
          echo "gave up after 8 rounds"; exit 1
