<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14110f">
<title>کتابخانه‌ی تصاویر ذره‌بین</title>
<style>
@font-face{font-family:Vz;src:url(../assets/fonts/Vazirmatn-Bold.ttf);font-weight:700}
@font-face{font-family:Vz;src:url(../assets/fonts/Vazirmatn-Black.ttf);font-weight:900}
:root{--bg:#14110f;--card:#211b17;--card2:#2b231d;--line:#3a2f27;--tx:#f6efe6;--mut:#a89a8a;--acc:#ffc21a;--acc-tx:#14100e;--ok:#5fe08a;--bad:#ff6b6b;--mag:#d4146e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Vz,system-ui,sans-serif;font-weight:700}
body{overflow-x:hidden;padding:0 16px calc(40px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;padding:18px 0 10px}
h1{font-size:20px;font-weight:900;margin:0}
h1 span{color:var(--acc)}
button,.btn{font:inherit;font-weight:700;border:0;border-radius:12px;min-height:46px;padding:0 16px;cursor:pointer;color:var(--tx);background:var(--card2);border:1px solid var(--line)}
button.pri,.btn.pri{background:var(--acc);color:var(--acc-tx);border-color:var(--acc)}
button:disabled{opacity:.5}
.tabs{display:flex;gap:8px;margin:8px 0 16px;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:5}
.tabs button{flex:1;min-height:44px}
.tabs button.on{background:var(--acc);color:var(--acc-tx);border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.item{display:grid;grid-template-columns:76px 1fr;gap:12px;align-items:center}
.thumb{width:76px;height:76px;border-radius:12px;background:repeating-conic-gradient(#2a221c 0 25%,#241d18 0 50%) 0 0/16px 16px;display:grid;place-items:center;overflow:hidden;color:var(--mut);font-size:12px}
.thumb img{width:100%;height:100%;object-fit:contain}
.name{font-size:17px;font-weight:900}
.en{direction:ltr;text-align:right;color:var(--mut);font-size:13px;margin-top:2px}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.row>*{flex:1}
.badge{display:inline-block;font-size:12px;padding:2px 10px;border-radius:99px;background:var(--card2);border:1px solid var(--line);margin-inline-start:8px;color:var(--mut)}
.badge.ok{color:var(--ok);border-color:#2f6b44}
.st{font-size:13px;color:var(--mut);margin-top:8px;min-height:18px}
.st.ok{color:var(--ok)}.st.bad{color:var(--bad)}
input[type=text],input[type=password],textarea{width:100%;font:inherit;font-weight:500;color:var(--tx);background:#17120f;border:1px solid var(--line);border-radius:12px;padding:12px;min-height:46px}
textarea{min-height:130px;direction:ltr;text-align:left;font-size:13px;line-height:1.5}
input.ltr{direction:ltr;text-align:left}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 6px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px;text-align:center}
.tile .thumb{width:100%;height:auto;aspect-ratio:1;border-radius:10px}
.tile small{display:block;margin:6px 0 2px;font-size:12px}
dialog{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:18px;max-width:92vw;width:560px;padding:16px}
dialog::backdrop{background:rgba(0,0,0,.7)}
.vars{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.run{border-top:1px solid var(--line);padding-top:10px;margin-top:10px;font-size:13px}
.run b{color:var(--acc)}
.card,.row>*{min-width:0}
.row a.btn{display:grid;place-items:center;text-decoration:none;flex:0 0 auto}
.vrow{display:flex;align-items:center;gap:6px;margin:8px 0;flex-wrap:nowrap}
.vrow .vname{flex:1;min-width:0;text-align:left;font-size:13px;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vrow .vname small{display:block;color:var(--mut);font-size:11px;direction:rtl;text-align:right}
.vrow .btn,.vrow button{min-height:40px;padding:0 12px;flex:0 0 auto}
.vrow .vdel{padding:0 10px}
.hint{color:var(--mut);font-size:13px;line-height:1.7}
#toast{position:fixed;inset-inline:16px;bottom:calc(16px + env(safe-area-inset-bottom));background:var(--acc);color:var(--acc-tx);padding:12px 16px;border-radius:14px;text-align:center;transform:translateY(160%);transition:.25s;z-index:20}
#toast.show{transform:none}
</style>
</head>
<body>
<header>
  <h1>کتابخانه‌ی <span>ذره‌بین</span></h1>
  <button id="btnSet">تنظیمات</button>
</header>

<section id="settings" class="card" hidden>
  <label>نام ریپو</label>
  <input type="text" class="ltr" id="repo" value="amirzadehes/zarrebin-video">
  <label>توکن GitHub (فقط روی همین دستگاه ذخیره می‌شود)</label>
  <input type="password" class="ltr" id="token" placeholder="github_pat_...">
  <label>سبک تصویرها و ویدیو (پرامپت عکس و ظاهر ویدیو با هم عوض می‌شوند)</label>
  <select id="tplStyle" style="width:100%;min-height:46px;font:inherit;background:#17120f;color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:0 10px"><option value="comic">کمیک رنگی</option><option value="vox">ووکس: گراوور و عکس قدیمی</option></select>
  <div class="row"><button class="pri" id="btnSave">ذخیره و بررسی اتصال</button></div>
  <div class="st" id="setSt"></div>
  <p class="hint">توکن را فقط با دسترسی Contents (خواندن و نوشتن) و فقط برای همین ریپو بساز.</p>
  <div class="card" style="margin-top:14px"><div class="name">موزیک‌های پس‌زمینه</div>
    <p class="hint">فایل موزیک (مثلاً از Gemini، Pixabay یا YouTube Audio Library) را همین‌جا بده و حالتش را مشخص کن. ساخت ویدیو بر اساس موضوع قسمت یکی از همین‌ها را زیر صدا می‌گذارد.</p>
    <select id="mMood" style="width:100%;min-height:46px;font:inherit;background:#17120f;color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:0 10px"><option value="any">برای همه‌ی موضوع‌ها</option><option value="calm">آرام و گرم</option><option value="curious">کنجکاو و علمی</option><option value="mystery">رازآلود</option><option value="upbeat">شاد و پرانرژی</option><option value="dramatic">جدی و دراماتیک</option></select>
    <div class="row"><label class="btn pri" style="display:grid;place-items:center;margin:0;color:var(--acc-tx)">افزودن موزیک<input type="file" id="mFile" accept="audio/*,.mp3,.m4a,.wav,.ogg" multiple hidden></label></div>
    <div class="st" id="mSt"></div><div id="mList"></div></div>
  <div class="row"><button id="btnLib">نمایش کتابخانه‌ی تصاویر</button></div>
  <div id="lib" hidden style="margin-top:12px"></div>
</section>

<nav class="tabs">
  <button data-t="want" class="on">مورد نیاز</button>
  <button data-t="ep">قسمت</button>
  <button data-t="gen">عمومی</button>
</nav>

<main>
  <div id="want"></div>
  <div id="ep" hidden></div>
  <div id="gen" hidden></div>
</main>

<dialog id="dlg"><div id="dlgBody"></div><div class="row"><button onclick="dlg.close()">بستن</button></div></dialog>
<div id="toast"></div>

<script>
const DEFAULT_TPL = "{subject}, hand-drawn comic ink illustration, bold black outline, vivid saturated colors, single object centered, isolated on a flat solid magenta background (#DD0F7A), no shadow, no text, vertical 9:16, closed outline, no glow or rays outside the outline";
const VOX_TPL = "A modern, present-day {subject} (the object itself must look contemporary and current, NOT antique or old-fashioned), drawn and rendered in the style of a vintage engraving illustration hand-colored with rich vivid watercolor: strong saturated yet slightly aged palette (deep ochre, teal, brick red, olive green, golden yellow, warm cream), bold colors with good contrast, fine dark ink linework with crosshatching, rich detail. Only the drawing technique is vintage, the subject is modern. Single subject centered, isolated on a flat solid magenta background (#DD0F7A), no shadow, no text, no frame, vertical 9:16, closed clean outline, no glow or rays outside the outline";
const $ = s => document.querySelector(s);
const ls = { get:(k,d)=>{try{return localStorage.getItem(k)??d}catch(e){return d}}, set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}} };
const fa = n => String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
const sleep = ms => new Promise(r => setTimeout(r, ms));
let S = { repo: ls.get('repo','amirzadehes/zarrebin-video'), token: ls.get('token',''), style: ls.get('style','comic'), wanted: [], pool: [], genN: +ls.get('genN','30'), catalog: {items:{}}, report: {runs:[]}, pending: 0, custom: JSON.parse(ls.get('custom','[]')) };

function toast(t, ms=3200){ const e=$('#toast'); e.textContent=t; e.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>e.classList.remove('show'), ms); }
async function api(path, opt={}){
  const h = { 'Accept':'application/vnd.github+json' }; if (S.token) h.Authorization = 'Bearer '+S.token;
  if (opt.body) h['Content-Type']='application/json';
  const r = await fetch('https://api.github.com/repos/'+S.repo+path, { ...opt, headers:h, cache:'no-store' });
  if (!r.ok) { let m=''; try{ m=(await r.json()).message }catch(e){} const err=new Error(m||('HTTP '+r.status)); err.status=r.status; throw err; }
  return r.status===204 ? null : r.json();
}
async function readJson(p, dflt){ try{ const j=await api('/contents/'+p); const b=atob(j.content.replace(/\n/g,'')); return JSON.parse(new TextDecoder().decode(Uint8Array.from(b,c=>c.charCodeAt(0)))); }catch(e){ return dflt } }
const raw = f => 'https://raw.githubusercontent.com/'+S.repo+'/main/library/'+f;
const slug = s => s.toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
function prompt(subject){ return (S.style==='vox'?VOX_TPL:DEFAULT_TPL).replace('{subject}', subject); }
async function copy(text){ try{ await navigator.clipboard.writeText(text); return true }catch(e){ const t=document.createElement('textarea'); t.value=text; document.body.appendChild(t); t.select(); let ok=false; try{ ok=document.execCommand('copy') }catch(e){} t.remove(); return ok } }

/* ---------- data ---------- */
async function loadAll(keepEp){
  S.wanted = await readJson('wanted.json', []);
  S.pool = await readJson('generic-pool.json', []);
  S.catalog = await readJson('library/catalog.json', {items:{}});
  S.report = await readJson('library/report.json', {runs:[]});
  try{ const l = await api('/contents/inbox'); S.pending = l.filter(x=>x.type==='file' && !x.name.startsWith('.')).length }catch(e){ S.pending = 0 }
  renderAll();
}

/* ---------- render ---------- */
function items(){
  const list = [...S.wanted, ...S.custom.filter(c=>!S.wanted.some(w=>w.id===c.id))];
  return list.map(w=>({ ...w, n: (S.catalog.items[w.id]?.variants||[]).length })).sort((a,b)=> (a.n>0)-(b.n>0));
}
function renderWant(){
  const el = $('#want'); const L = items();
  cards(el, L, true);
}
function cards(el, L, withAdd, head){
  const missing = L.filter(x=>x.n===0).length;
  let h = `<p class="hint styleNote" style="color:var(--acc)">${styleNote()}</p>` + (head || `<p class="hint">${fa(missing)} مورد هنوز تصویر ندارد.${S.pending?` · ${fa(S.pending)} تصویر در انتظار پردازش`:''}</p>`);
  h += L.map(w=>{
    const v = (S.catalog.items[w.id]?.variants||[])[0];
    return `<div class="card item" data-id="${w.id}">
      <div class="thumb">${v?`<img loading="lazy" src="${raw(v)}">`:'بدون تصویر'}</div>
      <div>
        <div class="name">${w.fa||w.en}<button class="bEdit" title="ویرایش نام" style="min-height:30px;padding:0 8px;margin-inline-start:8px">✎</button>${w.n?`<span class="badge ok">${fa(w.n)} تصویر</span>`:''}</div>
        <div class="en">${w.en}</div>
      </div>
      <div style="grid-column:1/-1">
        <div class="row">
          <button class="bCopy">کپی پرامپت</button>
          <label class="btn pri" style="display:grid;place-items:center;margin:0;color:var(--acc-tx)">آپلود تصویر<input type="file" accept="image/*" multiple hidden class="bFile"></label>
        </div>
        <div class="st"></div>
      </div>
    </div>`}).join('');
  if(withAdd) h += `<div class="card"><div class="name">شیء جدید</div>
     <label>نام شیء به انگلیسی (مثلاً: red apple)</label><input type="text" class="ltr" id="newEn">
     <label>نام فارسی (اختیاری)</label><input type="text" id="newFa">
     <div class="row"><button class="pri" id="btnAdd">افزودن به فهرست</button></div></div>`;
  el.innerHTML = h;
  el.querySelectorAll('.item').forEach(c=>{
    const id=c.dataset.id, w=L.find(x=>x.id===id), st=c.querySelector('.st');
    c.querySelector('.bEdit').onclick = ()=>renameItem(id, w.fa||w.en, w.en);
    c.querySelector('.bCopy').onclick = async()=>{ const ok = await copy(prompt(w.en)); st.className='st '+(ok?'ok':'bad'); st.textContent = ok?'پرامپت کپی شد؛ در Gemini بچسبان':'کپی نشد'; };
    c.querySelector('.bFile').onchange = e => upload(id, [...e.target.files], st, e.target);
  });
  if(withAdd) $('#btnAdd').onclick = ()=>{ const en=$('#newEn').value.trim(), id=slug(en); if(!id) return toast('نام انگلیسی را بنویس');
    if(!S.custom.some(c=>c.id===id)&&!S.wanted.some(c=>c.id===id)){ S.custom.push({id,en,fa:$('#newFa').value.trim(),tags:[]}); ls.set('custom',JSON.stringify(S.custom)); }
    renderWant(); toast('اضافه شد'); };
}
function renderGen(){
  const have = id => (S.catalog.items[id]?.variants||[]).length>0;
  const miss = S.pool.filter(p=>!have(p.id));
  const shown = miss.slice(0, S.genN).map(w=>({...w,n:0}));
  const head = `<p class="hint">پرکاربردترین‌ها در بالا هستند. ${fa(miss.length)} مورد عمومی هنوز ساخته نشده؛ ${fa(shown.length)} مورد نمایش داده می‌شود. بعد از هر آپلود موفق، همان مورد از این فهرست می‌رود و به کتابخانه می‌آید.</p>`;
  cards($('#gen'), shown, false, head);
  const more = document.createElement('div'); more.className='card';
  more.innerHTML = miss.length>shown.length ? `<button class="pri" id="btnMore" style="width:100%">۳۰ مورد دیگر اضافه کن (${fa(miss.length-shown.length)} باقی‌مانده)</button>` : '<p class="hint">همه‌ی موارد پیشنهادی نمایش داده شد. اگر مورد دیگری خواستی در «مورد نیاز» اضافه کن یا به من بگو تا فهرست را بزرگ‌تر کنم.</p>';
  $('#gen').appendChild(more);
  const b = more.querySelector('#btnMore'); if(b) b.onclick=()=>{ S.genN+=30; ls.set('genN',String(S.genN)); renderGen(); toast('۳۰ مورد اضافه شد'); };
}
/* ---------- episode ---------- */
const enc = t => btoa(String.fromCharCode(...new TextEncoder().encode(t)));
async function renderEp(){
  const el = $('#ep'); let eps=[];
  try{ eps = (await api('/contents/episodes')).filter(x=>x.type==='dir').map(x=>x.name) }catch(e){}
  const cur = ls.get('curEp','');
  el.innerHTML = `<div class="card"><div class="name">قسمت جدید</div>
    <label>نام قسمت به انگلیسی (مثلاً sleep-debt)</label><input type="text" class="ltr" id="epName" value="${cur}">
    <label>متن کامل پادکست / روایت (فارسی)</label><textarea id="epText" rows="8" style="width:100%;min-height:200px;direction:rtl;text-align:right;font-size:15px"></textarea>
    <div class="row"><button class="pri" id="epSend">ارسال و تحلیل</button></div><div class="st" id="epSt"></div></div>
    ${eps.length?`<div class="card"><label>قسمت‌های قبلی</label><div class="row" id="epList">${eps.map(e=>`<button data-e="${e}">${e}</button>`).join('')}</div></div>`:''}
    <div class="card" id="epBuild"><div class="name">ساخت ویدیو</div>
      <label>طول تقریبی ویدیو (اگر صدای خودت را بدهی، طول ویدیو دقیقاً به اندازه‌ی صدای توست و این گزینه نادیده گرفته می‌شود)</label>
      <select id="bMin" style="width:100%;min-height:46px;font:inherit;background:#17120f;color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:0 10px"><option value="3">حدود ۳ دقیقه (آزمایشی)</option><option value="5">حدود ۵ دقیقه</option><option value="7" selected>حدود ۷ دقیقه</option><option value="8">حدود ۸ دقیقه</option></select>
      <label>صدای خودت (اختیاری): اگر فایل صدا انتخاب کنی، به‌جای صدای هوش مصنوعی همان استفاده می‌شود</label>
      <input type="file" id="bOwn" accept="audio/*,.mp3,.m4a,.wav,.aac,.ogg,.opus" style="width:100%">
      <p class="hint">اگر صدای خودت را بدهی، همان متن بالا برای زمان‌بندی دقیق زیرنویس استفاده می‌شود؛ لازم نیست دوباره بفرستی.</p>
      <label><input type="checkbox" id="bSfx" checked> افکت‌های صوتی ریز (پاپ، ویژ، دینگ)</label>
      <label>سبک تصویر</label>
      <select id="bStyle" style="width:100%;min-height:46px;font:inherit;background:#17120f;color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:0 10px"><option value="comic" selected>کمیک (رنگارنگ و پرانرژی)</option><option value="vox">ووکس (ساده، مدرن، شبیه ویدیوهای توضیحی Vox)</option></select>
      <label>موزیک پس‌زمینه (رایگان، ساخته‌شده توسط خودمان، زیر صدا آرام می‌شود)</label>
      <select id="bMusic" style="width:100%;min-height:46px;font:inherit;background:#17120f;color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:0 10px"><option value="auto" selected>خودکار (از موزیک‌های آپلودشده، بر اساس موضوع)</option><option value="calm">آرام و گرم</option><option value="curious">کنجکاو و علمی</option><option value="mystery">رازآلود</option><option value="upbeat">شاد و پرانرژی</option><option value="dramatic">جدی و دراماتیک</option><option value="synth">موزیک ساخته‌شده با کد (ساده)</option><option value="none">بدون موزیک</option></select>
      <label>صدای راوی هوش مصنوعی </label>
      <select id="bVoice" style="width:100%;min-height:46px;font:inherit;background:#17120f;color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:0 10px"><option>Algieba</option><option>Sulafat</option><option>Charon</option><option>Kore</option><option>Puck</option><option>Orus</option><option>Gacrux</option></select>
      <label><input type="checkbox" id="bV" checked> اینستاگرام (عمودی)</label>
      <label><input type="checkbox" id="bH" checked> یوتیوب (افقی)</label>
      <p class="hint" id="bCover"></p><div class="row"><button class="pri" id="bGo">ساخت ویدیو از روی این قسمت</button></div><div class="st" id="bSt"></div>
      <p class="hint">بعد از زدن دکمه حدود ۱۰ تا ۳۰ دقیقه طول می‌کشد. می‌توانی اپ را ببندی؛ ویدیوی آماده در لیست زیر می‌آید.</p>
      <div id="vids"></div></div>
    <div id="epNeeds"></div>`;
  $('#bStyle').value=S.style; $('#bStyle').onchange=()=>setStyle($('#bStyle').value);
  $('#bGo').onclick = buildVideo; loadVids();
  el.querySelectorAll('#epList button').forEach(b=>b.onclick=()=>{ ls.set('curEp',b.dataset.e); $('#epName').value=b.dataset.e; showNeeds(b.dataset.e); readText(b.dataset.e); });
  $('#epSend').onclick = sendEp;
  if(cur){ showNeeds(cur); readText(cur); }
}
async function readText(ep){ try{ const j=await api('/contents/episodes/'+ep+'/script.txt'); $('#epText').value=new TextDecoder().decode(Uint8Array.from(atob(j.content.replace(/\n/g,'')),c=>c.charCodeAt(0))); }catch(e){} }
async function loadVids(){
  const box=$('#vids'); if(!box) return;
  try{ const rel=(await api('/releases?per_page=30')).filter(r=>!/^voices?-/.test(r.tag_name)&&!/sample/i.test(r.name||'')).slice(0,12);
    box.innerHTML = rel.length ? '<label>ویدیوهای ساخته‌شده</label>'+rel.map(r=>{
      const d=new Date(r.created_at).toLocaleString('fa-IR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
      return `<div class="vrow" data-id="${r.id}" data-tag="${r.tag_name}"><span class="vname" dir="ltr">${r.name||r.tag_name}<small>${d}</small></span>${r.assets.map(a=>`<a class="btn" href="${a.browser_download_url}" target="_blank" rel="noopener">${/vertical/.test(a.name)?'اینستاگرام':/horizontal/.test(a.name)?'یوتیوب':a.name.replace(/\.[a-z0-9]+$/,'')}</a>`).join('')}<button class="vdel" title="پاک کردن">🗑</button></div>`}).join('') : '';
    box.querySelectorAll('.vdel').forEach(b=>b.onclick=()=>delVid(b.closest('.vrow')));
  }catch(e){}
}
async function delVid(row){
  if(!S.token) return toast('اول در تنظیمات توکن را وارد کن');
  if(!confirm('این ویدیو پاک شود؟')) return;
  try{ await api('/releases/'+row.dataset.id,{method:'DELETE'}); try{ await api('/git/refs/tags/'+row.dataset.tag,{method:'DELETE'}) }catch(e){} row.remove(); toast('پاک شد ✓'); }
  catch(e){ toast('خطا: '+e.message) }
}
async function buildVideo(){
  const st=$('#bSt'), ep=slug($('#epName').value);
  if(!S.token){ st.className='st bad'; st.textContent='اول در تنظیمات توکن را وارد کن'; return; }
  if(!ep){ st.className='st bad'; st.textContent='نام قسمت را بنویس (همان که متن را با آن فرستادی)'; return; }
  const formats=[$('#bV').checked&&'v',$('#bH').checked&&'h'].filter(Boolean); if(!formats.length){ st.className='st bad'; st.textContent='حداقل یک حالت را انتخاب کن'; return; }
  try{ await api('/contents/episodes/'+ep+'/script.txt'); }catch(e){ st.className='st bad'; st.textContent='برای این قسمت هنوز متنی فرستاده نشده'; return; }
  const ownF=$('#bOwn').files[0]; const body={formats, minutes:+$('#bMin').value, lang:'fa', tts:'gemini', voice:$('#bVoice').value, ts:Date.now()}; if(ownF) body.own_voice=true; body.sfx=$('#bSfx').checked; body.music=$('#bMusic').value; body.style=S.style;
  st.className='st'; st.textContent='در حال شروع…';
  try{
    if(ownF){ st.className='st'; st.textContent='در حال آپلود صدا…'; const ext=(ownF.name.split('.').pop()||'mp3').toLowerCase().replace(/[^a-z0-9]/g,'');
      const b64=await toB64(ownF); let osha; try{ osha=(await api('/contents/episodes/'+ep+'/voice_user.'+ext)).sha }catch(e){}
      await api('/contents/episodes/'+ep+'/voice_user.'+ext,{method:'PUT',body:JSON.stringify({message:'own voice: '+ep,content:b64,branch:'main',sha:osha})}); }
    if(ownF){ let txt=$('#epText').value.trim(); if(txt.length<20){ try{ const j=await api('/contents/episodes/'+ep+'/script.txt'); txt=new TextDecoder().decode(Uint8Array.from(atob(j.content.replace(/\n/g,'')),c=>c.charCodeAt(0))).trim() }catch(e){} }
      if(txt.length>20){ let ssha; try{ ssha=(await api('/contents/episodes/'+ep+'/spoken.txt')).sha }catch(e){}
        await api('/contents/episodes/'+ep+'/spoken.txt',{method:'PUT',body:JSON.stringify({message:'spoken text: '+ep,content:enc(txt),branch:'main',sha:ssha})}); } }
    let sha; try{ sha=(await api('/contents/episodes/'+ep+'/request.json')).sha }catch(e){}
    await api('/contents/episodes/'+ep+'/request.json',{method:'PUT',body:JSON.stringify({message:'build video: '+ep,content:enc(JSON.stringify(body)),branch:'main',sha})});
    st.className='st ok'; st.textContent='شروع شد. حدود ۱۰ تا ۳۰ دقیقه بعد ویدیو در همین لیست می‌آید.';
    let logSha; try{ logSha=(await api('/contents/episodes/'+ep+'/build.log')).sha }catch(e){}
    for(let k=0;k<90;k++){ await sleep(30000); const before=$('#vids')?.textContent.length||0; await loadVids(); if(($('#vids')?.textContent.length||0)!==before){ st.textContent='ویدیو آماده شد!'; return }
      try{ const j=await api('/contents/episodes/'+ep+'/build.log'); if(j.sha!==logSha){ const txt=new TextDecoder().decode(Uint8Array.from(atob(j.content.replace(/\n/g,'')),c=>c.charCodeAt(0)));
        if(/daily free limit|Gemini TTS failed|Groq failed|Groq error|Traceback|GEMINI_API_KEY is not set|GROQ_API_KEY is not set/.test(txt)){ st.className='st bad'; st.textContent=/daily free limit/.test(txt)?'سهمیه‌ی روزانه‌ی رایگان صدای گوگل (۱۰ درخواست در روز) تمام شده؛ چند ساعت بعد دوباره بزن.':'ساخت متوقف شد: '+txt.trim().split('\n').slice(-1)[0].slice(0,200); return } } }catch(e){} }
  }catch(e){ st.className='st bad'; st.textContent='خطا: '+e.message }
}
async function showNeeds(ep){
  const box = $('#epNeeds'); box.innerHTML='<p class="hint">در حال خواندن…</p>';
  const j = await readJson('episodes/'+ep+'/needs.json', null);
  if(!j){ box.innerHTML='<p class="hint">هنوز تحلیلی برای این قسمت نیست (اگر تازه فرستاده‌ای، یک دقیقه صبر کن و دوباره بزن).</p>'; return false; }
  if(j.error){ box.innerHTML=`<p class="hint" style="color:var(--bad)">تحلیل خطا داد. ${/GROQ_API_KEY is not set/.test(j.message||'')?'کلید Groq هنوز در Secrets ریپو گذاشته نشده است.':'دلیل: '+(j.message||'نامشخص')}</p>`; return true; }
  const L = j.items.map(w=>({...w, n:(S.catalog.items[w.id]?.variants||[]).length})).sort((a,b)=>(a.n>0)-(b.n>0));
  const miss = L.filter(x=>x.n===0).length;
  const tmp = document.createElement('div'); cards(tmp, L, false, `<p class="hint">این قسمت ${fa(L.length)} شیء لازم دارد؛ ${fa(miss)} مورد را هنوز نداریم (بالای فهرست). مواردی که در کتابخانه هست دوباره ساخته نمی‌شود.</p>`);
  const have=L.length-miss; const bs=$('#bCover'); if(bs) bs.textContent=`تصاویر این قسمت: ${fa(have)} از ${fa(L.length)} آماده است. هرچه بیشتر باشد، ویدیو بهتر و مرتبط‌تر می‌شود.`;
  box.innerHTML=''; while(tmp.firstChild) box.appendChild(tmp.firstChild);
  return true;
}
async function sendEp(){
  const st=$('#epSt'), ep=slug($('#epName').value), text=$('#epText').value.trim();
  if(!S.token){ st.className='st bad'; st.textContent='اول در تنظیمات توکن را وارد کن'; return; }
  if(!ep||text.length<50){ st.className='st bad'; st.textContent='نام انگلیسی و متن کامل را وارد کن'; return; }
  st.className='st'; st.textContent='در حال ارسال…';
  try{
    let sha, oldN; try{ sha=(await api('/contents/episodes/'+ep+'/script.txt')).sha }catch(e){}
    try{ oldN=(await api('/contents/episodes/'+ep+'/needs.json')).sha }catch(e){}
    await api('/contents/episodes/'+ep+'/script.txt',{method:'PUT',body:JSON.stringify({message:'episode script: '+ep,content:enc(text),branch:'main',sha})});
    ls.set('curEp',ep); st.className='st ok'; st.textContent='ارسال شد؛ تحلیل حدود یک تا دو دقیقه طول می‌کشد…';
    for(let k=0;k<30;k++){ await sleep(8000); let n; try{ n=(await api('/contents/episodes/'+ep+'/needs.json')).sha }catch(e){}
      if(n && n!==oldN){ await loadAll(true); await showNeeds(ep); st.textContent='فهرست آماده شد'; return; } }
    st.className='st bad'; st.textContent='هنوز آماده نشد؛ بعداً از «قسمت‌های قبلی» باز کن.';
  }catch(e){ st.className='st bad'; st.textContent='خطا: '+e.message; }
}
function renderLib(){
  const its = Object.values(S.catalog.items||{});
  $('#btnLib').textContent = 'نمایش کتابخانه‌ی تصاویر ('+fa(its.length)+' مورد)';
  $('#lib').innerHTML = its.length ? `<div class="grid">${its.map(i=>`<div class="tile" data-id="${i.id}"><div class="thumb"><img loading="lazy" src="${raw(i.variants[0])}"></div><small>${i.fa||i.en}</small><span class="badge">${fa(i.variants.length)}</span></div>`).join('')}</div>` : '<p class="hint">هنوز تصویری در کتابخانه نیست.</p>';
  document.querySelectorAll('#lib .tile').forEach(t=>t.onclick=()=>{ const i=S.catalog.items[t.dataset.id]; $('#dlgBody').innerHTML=`<div class="name">${i.fa||i.en}</div><div class="en">${i.id}</div><div class="row"><button id="dlgEdit">ویرایش نام</button></div>${i.has_text_in_image?'<p class="hint" style="color:var(--bad)">این تصویر متن دارد و برای نسخه‌ی چندزبانه مناسب نیست.</p>':''}<div class="vars">${i.variants.map(v=>`<div class="thumb" style="width:100%;height:auto;aspect-ratio:1"><img src="${raw(v)}"></div>`).join('')}</div>`; dlg.showModal(); $('#dlgEdit').onclick=()=>{ dlg.close(); renameItem(i.id, i.fa||i.en, i.en) }; });
}
let keepEpDone=false;
function renderAll(){ if(!keepEpDone){ keepEpDone=true; renderEp(); } renderGen(); renderWant(); renderLib(); }

/* ---------- upload ---------- */
const toB64 = f => new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result.split(',')[1]); r.onerror=rej; r.readAsDataURL(f); });
async function put(path, b64, msg){
  for(let k=0;k<4;k++){
    try{ return await api('/contents/'+path, { method:'PUT', body: JSON.stringify({ message: msg, content: b64, branch:'main' }) }); }
    catch(e){ if(k===3 || ![409,422,502,503].includes(e.status)) throw e; await sleep(1500*(k+1)); }
  }
}
async function upload(id, files, st, input){
  if(!S.token){ st.className='st bad'; st.textContent='اول در تنظیمات توکن را وارد کن'; $('#settings').hidden=false; return; }
  if(!files.length) return; let ok=0, bad=0;
  for(let i=0;i<files.length;i++){
    const f=files[i]; st.className='st'; st.textContent=`ارسال ${fa(i+1)} از ${fa(files.length)}…`;
    if(f.size>25*1024*1024){ bad++; continue; }
    const ext=(f.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';
    const name=`${id}__${Date.now().toString(36)}${i}.${ext}`;
    try{ await put('inbox/'+name, await toB64(f), 'inbox: '+name); ok++; }
    catch(e){ bad++; st.className='st bad'; st.textContent='خطا: '+e.message; if(e.status===401||e.status===403||e.status===404) break; }
    if(i<files.length-1) await sleep(1300);   // stay under GitHub's content-creation rate limit
  }
  input.value='';
  if(ok){ st.className='st ok'; st.textContent=`${fa(ok)} تصویر ارسال شد${bad?` (${fa(bad)} ناموفق)`:''}. پردازش حدود ۱ تا ۲ دقیقه طول می‌کشد.`; toast('ارسال شد؛ منتظر ذخیره در کتابخانه…'); S.pending+=ok; watchUpload(ok); }
}

function renameItem(id, curFa, curEn){
  $('#dlgBody').innerHTML=`<div class="name">ویرایش نام</div><div class="en">${id}</div><label>نام فارسی جدید (انگلیسی‌اش خودکار ترجمه می‌شود و در پرامپت می‌آید)</label><input type="text" id="rnFa" value="${(curFa||'').replace(/"/g,'&quot;')}"><p class="hint">نام انگلیسی فعلی: <bdi>${curEn||''}</bdi></p><div class="row"><button class="pri" id="rnGo">ذخیره</button></div><div class="st" id="rnSt"></div>`;
  dlg.showModal(); $('#rnFa').focus();
  $('#rnGo').onclick=async()=>{ const fa2=$('#rnFa').value.trim(), st=$('#rnSt'); if(!fa2) return; if(!S.token){ st.className='st bad'; st.textContent='اول در تنظیمات توکن را وارد کن'; return }
    st.className='st'; st.textContent='در حال ارسال…';
    try{ await put('renames/'+id+'__'+Date.now().toString(36)+'.json', enc(JSON.stringify({id, fa:fa2})), 'rename: '+id);
      S.custom=S.custom.filter(c=>c.id!==id); ls.set('custom',JSON.stringify(S.custom));
      st.textContent='ارسال شد؛ ترجمه و ذخیره حدود یک دقیقه طول می‌کشد…'; toast('نام در حال تغییر است…');
      for(let k=0;k<30;k++){ await sleep(8000); const cat=await readJson('library/catalog.json',{items:{}}), wl=await readJson('wanted.json',[]); const it=cat.items[id]||wl.find(w=>w.id===id);
        if(it && it.fa===fa2){ await loadAll(); dlg.close(); toast('✓ نام عوض شد: '+it.en,5000); return } }
      st.className='st bad'; st.textContent='هنوز اعمال نشد؛ کمی بعد صفحه را تازه کن.';
    }catch(e){ st.className='st bad'; st.textContent='خطا: '+e.message } };
}
let watching=false;
async function watchUpload(n){
  if(watching) return; watching=true;
  const count=()=>Object.values(S.catalog.items||{}).reduce((a,i)=>a+i.variants.length,0);
  const before=count();
  for(let k=0;k<40;k++){ await sleep(12000); await loadAll();
    if(S.pending===0){ const got=count()-before;
      toast(got>0?`✓ آپلود انجام شد: ${fa(got)} تصویر در کتابخانه ذخیره شد`:'پردازش تمام شد ولی تصویر جدیدی ذخیره نشد (تکراری یا نامعتبر بود)',5000); break; } }
  watching=false;
}
/* ---------- settings / tabs ---------- */
$('#btnSet').onclick=()=>{ $('#settings').hidden=!$('#settings').hidden; };
$('#repo').value=S.repo; $('#token').value=S.token;
function setStyle(v,quiet){ S.style=v; ls.set('style',v); const a=$('#tplStyle'), b=$('#bStyle'); if(a) a.value=v; if(b) b.value=v; document.querySelectorAll('.styleNote').forEach(e=>e.textContent=styleNote()); if(!quiet) toast(v==='vox'?'سبک ووکس: پرامپت عکس و ویدیو عوض شد ✓':'سبک کمیک: پرامپت عکس و ویدیو عوض شد ✓') }
const styleNote=()=>'سبک فعلی پرامپت عکس: '+(S.style==='vox'?'ووکس (گراوور و عکس قدیمی رنگی)':'کمیک رنگی');
$('#tplStyle').value=S.style; $('#tplStyle').onchange=()=>setStyle($('#tplStyle').value);
$('#btnSave').onclick=async()=>{
  S.repo=$('#repo').value.trim(); S.token=$('#token').value.trim();
  ls.set('repo',S.repo); ls.set('token',S.token);
  const st=$('#setSt'); st.className='st'; st.textContent='در حال بررسی…';
  try{ const r=await api(''); st.className='st '+(r.permissions?.push?'ok':'bad'); st.textContent = r.permissions?.push ? 'اتصال برقرار است و اجازه‌ی نوشتن دارد ✓' : 'اتصال هست ولی اجازه‌ی نوشتن نداری؛ توکن را با دسترسی Contents بساز'; await loadAll(); }
  catch(e){ st.className='st bad'; st.textContent='خطا: '+e.message; }
};
const MOODFA={any:'همه',calm:'آرام',curious:'کنجکاو',mystery:'رازآلود',upbeat:'شاد',dramatic:'جدی'};
async function loadMusic(){ const box=$('#mList'); if(!box) return; let L=[]; try{ L=(await api('/contents/music')).filter(x=>x.type==='file'&&/__/.test(x.name)) }catch(e){}
  box.innerHTML=L.length?L.map(x=>{const [m,...r]=x.name.split('__'); return `<div class="vrow" data-n="${x.name}" data-sha="${x.sha}"><span class="vname" dir="ltr">${r.join('__')}<small>${MOODFA[m]||m}</small></span><button class="mdel">🗑</button></div>`}).join(''):'<p class="hint">هنوز موزیکی آپلود نشده؛ تا آن موقع ویدیوها بدون موزیک ساخته می‌شوند.</p>';
  box.querySelectorAll('.mdel').forEach(b=>b.onclick=async()=>{ const r=b.closest('.vrow'); if(!confirm('این موزیک پاک شود؟')) return; try{ await api('/contents/music/'+r.dataset.n,{method:'DELETE',body:JSON.stringify({message:'remove music',sha:r.dataset.sha,branch:'main'})}); r.remove(); toast('پاک شد ✓') }catch(e){ toast('خطا: '+e.message) } }) }
$('#mFile').onchange=async e=>{ const st=$('#mSt'); if(!S.token){ st.className='st bad'; st.textContent='اول توکن را ذخیره کن'; return }
  const fs=[...e.target.files]; let ok=0; for(const f of fs){ if(f.size>40*1024*1024){ st.className='st bad'; st.textContent='فایل بزرگ‌تر از ۴۰ مگابایت است'; continue }
    st.className='st'; st.textContent='در حال آپلود '+f.name+'…'; const ext=(f.name.split('.').pop()||'mp3').toLowerCase().replace(/[^a-z0-9]/g,''); const base=slug(f.name.replace(/\.[^.]+$/,''))||'track';
    try{ await put('music/'+$('#mMood').value+'__'+base+'.'+ext, await toB64(f), 'music: '+base); ok++ }catch(er){ st.className='st bad'; st.textContent='خطا: '+er.message } }
  e.target.value=''; if(ok){ st.className='st ok'; st.textContent=fa(ok)+' موزیک ذخیره شد'; toast('✓ موزیک ذخیره شد'); loadMusic() } };
$('#btnSet').onclick=()=>{ $('#settings').hidden=!$('#settings').hidden; if(!$('#settings').hidden) loadMusic(); };
$('#btnLib').onclick=()=>{ const l=$('#lib'); l.hidden=!l.hidden; };
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{ document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b)); ['want','ep','gen'].forEach(t=>$('#'+t).hidden=t!==b.dataset.t); });
if(!S.token) $('#settings').hidden=false;
loadAll();
</script>
