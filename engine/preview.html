<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
@font-face{font-family:Vz;src:url(../assets/fonts/Vazirmatn-Bold.ttf);font-weight:700}
@font-face{font-family:Vz;src:url(../assets/fonts/Vazirmatn-Black.ttf);font-weight:900}
#msg[hidden]{display:none}
html,body{margin:0;background:#000;height:100%;overflow:hidden}
canvas{display:block;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);touch-action:none}
#msg{position:fixed;inset:0;display:grid;place-items:center;color:#fff;font:700 18px Vz,sans-serif;background:#000a;text-align:center;direction:rtl}
</style></head><body><canvas id="out"></canvas><div id="msg">در حال آماده‌سازی…</div>
<script src="fx.js"></script><script src="v2.js"></script>
<script>
/* in-app scene preview + layout editor. ?inline=1&fmt=v|h. parent -> {type:'load'|'edit'|'adj'|'stop'}, iframe -> {type:'ready'|'layout'} */
const msg=document.getElementById('msg'), cvs=document.getElementById('out'), au=new Audio(); au.preload='auto';
let sc=null, si=0, raf=0, playing=false, mode='play', ptrs=new Map(), pinch0=null;
function fit(){ const k=Math.min(innerWidth/W, innerHeight/H); cvs.style.width=(W*k)+'px'; cvs.style.height=(H*k)+'px' } addEventListener('resize',fit); fit();
/* sound effects chosen in the app (fx of type 'sound', files in ../sfx/): played together with the voice while the scene preview runs.
   Same times as tools/make_bgfx.py: picture time (it.t) or scene start + pin.start, plus fx.start; fx.end stops it early. Level ~ the final mix (clip peak .8 x weight .8) */
let sfxEv=[], sfxLast=0, sfxAct=new Set(), ALL=false, SYN=0;
function sfxBuild(){ sfxEv=[]; const add=(t0,f)=>{ if(!f||f.type!=='sound'||!f.file) return; const st=clampv(+f.start||0,0,600), en=+f.end||0; sfxEv.push({t:t0+st,file:String(f.file).split('/').pop(),dur:en>st?en-st:0,vol:clampv(f.vol==null?70:+f.vol,0,100)/100}) };
  (ALL?D.scenes:[sc]).forEach(s=>{ (s.items||[]).forEach(it=>{ (it.fx||[]).forEach(f=>add(it.t,f)); if(ALL&&SYN>0) sfxEv.push({t:it.t,synth:1}) }); (s.pins||[]).forEach(q=>{ (q.fx||[]).forEach(f=>add(s.t0+clampv(+q.start||0,0,120),f)); if(ALL&&SYN>0&&+q.start>0) sfxEv.push({t:s.t0+(+q.start),synth:1}) }) }) }
/* approximate entrance sound (pop + whoosh) at the owner's volume: the real sfx.wav only exists after the build */
let AC=null; function synth(){ try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); const t=AC.currentTime, g0=clampv(SYN/100,0,1.5)*.4, o=AC.createOscillator(), g=AC.createGain(); o.frequency.setValueAtTime(520,t); o.frequency.exponentialRampToValueAtTime(130,t+.12); g.gain.setValueAtTime(g0,t); g.gain.exponentialRampToValueAtTime(.0008,t+.16); o.connect(g).connect(AC.destination); o.start(t); o.stop(t+.18) }catch(e){} }
function sfxStop(){ sfxAct.forEach(a=>{ try{ a.pause() }catch(e){} }); sfxAct.clear() }
function sfxFire(from,to){ sfxEv.forEach(e=>{ if(e.t<from||e.t>=to) return; if(e.synth){ synth(); return } const a=new Audio('../sfx/'+encodeURIComponent(e.file)); a.volume=Math.min(1,e.vol*.64); sfxAct.add(a); a.onended=()=>sfxAct.delete(a); a.play().catch(()=>sfxAct.delete(a));
  if(e.dur>0) setTimeout(()=>{ try{ a.pause() }catch(x){} sfxAct.delete(a) },e.dur*1000) }) }
let sfxTm=0;   // own 25 ms timer: a slow frame (big scene, weak phone) must not delay a sound
function sfxPoll(){ const t=au.currentTime; if(t>=sfxLast){ sfxFire(sfxLast,t+.001); sfxLast=t+.001 } else sfxLast=t }
function stop(){ playing=false; cancelAnimationFrame(raf); au.pause(); clearInterval(sfxTm); sfxStop() }
function tick(){ if(!playing) return; const t=au.currentTime; sfxPoll(); if(t>=sc.t1-.02||au.ended){ seek(Math.max(sc.t1-.03,sc.t0)); playing=false; au.pause(); msg.hidden=false; msg.textContent='▶ دوباره پخش'; return } seek(t); raf=requestAnimationFrame(tick) }
async function play(){ stop(); setEdit(null); mode='play'; sfxBuild(); sfxLast=sc.t0-.001; au.currentTime=sc.t0; seek(sc.t0); try{ await au.play() }catch(e){ msg.hidden=false; msg.textContent='▶ برای پخش لمس کن'; return } msg.hidden=true; playing=true; sfxTm=setInterval(sfxPoll,25); tick() }
const editT=()=>Math.min(sc.t1-.2, D.meta.total-.6);
function edit(sel){ window.__sel=sel; stop(); mode='edit'; msg.hidden=true; setEdit({sel}); seek(editT()) }
cvs.addEventListener('pointerdown',e=>{ if(mode!=='edit'){ if(!playing&&sc) play(); return }
  if(e.isPrimary){ ptrs.clear(); pinch0=null }   // a new first finger always starts a fresh gesture (a lost pointerup must never block selecting)
  cvs.setPointerCapture(e.pointerId); ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY}); const p=toC(e); 
  if(ptrs.size===1){ const cur=currentSel(), hit=inBox(cur,p)?cur:hitTest(p); if(hit>=0&&hit!==cur){ edit(hit); post() } } if(ptrs.size===2){ const [a,b]=[...ptrs.values()]; pinch0={d:Math.hypot(a.x-b.x,a.y-b.y),sz:lay().sz||1} } });
cvs.addEventListener('pointermove',e=>{ if(mode!=='edit'||!ptrs.has(e.pointerId)) return; const o=ptrs.get(e.pointerId), s=currentSel(); if(s<0) return; const k=W/cvs.getBoundingClientRect().width;
  if(ptrs.size===1){ const L=lay(); L.dx=clampv((L.dx||0)+(e.clientX-o.x)*k/W,-.7,.7); L.dy=clampv((L.dy||0)+(e.clientY-o.y)*k/H,-.7,.7) }
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2&&pinch0){ const [a,b]=[...ptrs.values()]; lay().sz=clampv(pinch0.sz*Math.hypot(a.x-b.x,a.y-b.y)/pinch0.d,.3,3) }
  seek(editT()) });
const up=e=>{ if(ptrs.has(e.pointerId)){ ptrs.delete(e.pointerId); if(ptrs.size<2) pinch0=null; if(mode==='edit') post() } }; cvs.addEventListener('pointerup',up); cvs.addEventListener('pointercancel',up);
const clampv=(v,a,b)=>Math.max(a,Math.min(b,v));
function toC(e){ const r=cvs.getBoundingClientRect(), k=W/r.width; return {x:(e.clientX-r.left)*k,y:(e.clientY-r.top)*k} }
function currentSel(){ return window.__sel===undefined?-1:window.__sel }
function inBox(id,p){ const r=id>=0&&getRec()[id], it=sc.items[id], im=r&&IM[r.src||(it&&it.src)]; if(!im) return false; const m=Math.max(im.width,im.height); return Math.abs(p.x-r.x)<=im.width/m*r.size/2+45&&Math.abs(p.y-r.y)<=im.height/m*r.size/2+45 }
const kindOf=id=>id>=2000?'pin':id>=1000?'bg':'item';
function hitTest(p){ const R=getRec(), rank=i=>i>=2000?1:i>=1000?0:2; let best=-1;   // pins sit above the background copies, the scene's own pictures above both
  Object.keys(R).map(Number).sort((a,b)=>rank(a)-rank(b)||a-b).forEach(i=>{ const r=R[i], it=sc.items[i], im=IM[r.src||(it&&it.src)]; if(!im) return; const m=Math.max(im.width,im.height), w=im.width/m*r.size/2+45, h=im.height/m*r.size/2+45; if(Math.abs(p.x-r.x)<=w&&Math.abs(p.y-r.y)<=h) best=i });
  if(best<0){ let d0=260; Object.keys(R).forEach(i=>{ const d=Math.hypot(p.x-R[i].x,p.y-R[i].y); if(d<d0){ d0=d; best=+i } }) }   // missed by a finger-width: take the nearest image
  return best }
function lay(){ const id=currentSel(), k=kindOf(id), i=id%1000;
  if(k==='pin'){ const q=sc.pins[i]; q.lay=q.lay||{}; return q.lay[FMT]=q.lay[FMT]||{} }
  if(k==='bg'){ const b=sc.bg; b.lay=b.lay||{}; b.lay[FMT]=b.lay[FMT]||{}; return b.lay[FMT][i]=b.lay[FMT][i]||{} }
  const it=sc.items[id]; it.lay=it.lay||{}; return it.lay[FMT]=it.lay[FMT]||{} }
function resetLay(){ const id=currentSel(), k=kindOf(id), i=id%1000;
  if(k==='pin'){ const q=sc.pins[i]; if(q.lay) delete q.lay[FMT] } else if(k==='bg'){ const l=sc.bg.lay&&sc.bg.lay[FMT]; if(l) delete l[i] } else { const it=sc.items[id]; if(it.lay) delete it.lay[FMT] } }
function post(){ const s=currentSel(); if(s<0) return; parent.postMessage({type:'layout',scene:si,kind:kindOf(s),idx:s%1000,sel:s,fmt:FMT,lay:{...lay()}},'*') }
/* the voice comes from the parent app as a blob URL fetched through the GitHub API (m.audio); the Pages copy is only a fallback and is cache-busted, because Pages lags behind a push and an old voice would play under new subtitles */
function setAudio(m){ const u=m.audio||('../episodes/'+m.ep+'/voice.mp3?v='+Date.now()); if(au.dataset.u===u&&(m.audio||au.dataset.ep===m.ep)) return false; au.dataset.u=u; au.dataset.ep=m.ep; au.src=u; return true }
async function loadAudio(m,to){ const ch=setAudio(m); if(!ch&&au.readyState>=1){ chkAudio(); return } await new Promise(r=>{ au.onloadedmetadata=r; au.onerror=r; setTimeout(r,to) }); chkAudio() }
function chkAudio(){ const T=D&&D.meta&&D.meta.total; if(T&&isFinite(au.duration)&&au.duration>0&&Math.abs(au.duration-T)>4) parent.postMessage({type:'audio-mismatch',a:au.duration,t:T},'*') }
addEventListener('message',async e=>{ const m=e.data||{}; if(m.type==='stop'){ stop(); return }
  if(m.type==='adj'){ if(mode!=='edit'||currentSel()<0) return; const L=lay(); if(m.op==='bigger') L.sz=clampv((L.sz||1)*1.12,.3,3); else if(m.op==='smaller') L.sz=clampv((L.sz||1)/1.12,.3,3); else if(m.op==='rot') L.rot=((L.rot||0)+.2)%(Math.PI*2); else if(m.op==='reset') resetLay(); seek(editT()); post(); return }
  if(m.type==='playall'){ stop(); msg.hidden=false; msg.textContent='در حال آماده‌سازی کل ویدیو…'; try{ await loadData(m.data); await loadAudio(m,6000); ALL=true; SYN=m.sfxVol==null?65:+m.sfxVol; sc={t0:0,t1:D.meta.total,items:[],pins:[]}; si=0; play() }catch(err){ msg.textContent='خطا: '+err.message } return }
  if(m.type==='sel'){ if(sc&&getRec()[m.idx]){ edit(m.idx); post() } return }
  if(m.type==='edit'){ ALL=false; if(m.data) await ld(m); edit(m.sel>=1000?m.sel:Math.min(m.sel||0,sc.items.length-1)); post(); return }
  if(m.type!=='load') return; ALL=false; stop(); msg.hidden=false; msg.textContent='در حال آماده‌سازی…';
  try{ await ld(m); await loadAudio(m,4000); play() }catch(err){ msg.textContent='خطا: '+err.message } });
async function ld(m){ si=m.scene; await loadData(m.data,[si-1,si,si+1].filter(k=>k>=0&&k<m.data.scenes.length)); sc=D.scenes[si]; fit(); setAudio(m) }
parent.postMessage({type:'ready'},'*');
</script></body></html>
